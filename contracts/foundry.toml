[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Avalanche C-Chain / Fuji support Cancun opcodes since the Etna upgrade.
# OZ 5.x SignatureChecker uses MCOPY, so Cancun is required.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# OpenZeppelin comes from the repo-root node_modules (pnpm add -D @openzeppelin/contracts@5).
allow_paths = ["../node_modules"]
remappings = [
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 120

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
